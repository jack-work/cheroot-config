# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:RGB'

# Move between splits
set -g mode-keys vi

# Enable mouse support
set -g mouse on

# Clipboard: use OSC 52 + wl-copy for system clipboard across all sessions
set -g set-clipboard on
set -g allow-passthrough on

bind-key S choose-window 'join-pane -v -s "%%"'
bind-key V choose-window 'join-pane -h -s "%%"'



# for visual selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Smart pane switching with awareness of Neovim splits
# Uses @pane-is-vim variable set by smart-splits.nvim
# NOTE: Plain Ctrl+hjkl.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Smart pane resizing with awareness of Neovim splits
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Smart pane switching, backslash = last-used pane.
# NOTE: this used to be wrapped in a bc-based tmux-version test. bc is not
# installed here, so both if-shell branches failed silently and the binding
# never existed at all. tmux is >= 3.0; bind it directly.
bind-key -n 'C-\' if -F "#{@pane-is-vim}" 'send-keys C-\\' 'select-pane -l'

# Yank to system clipboard via OSC 52 (works in popups, over SSH, etc.)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Swap panes directionally (prefix-based)
bind-key H swap-pane -s . -t '{left-of}'\; select-pane -t '{left-of}'
bind-key J swap-pane -s . -t '{down-of}'\; select-pane -t '{down-of}'
bind-key K swap-pane -s . -t '{up-of}'\; select-pane -t '{up-of}'
bind-key L swap-pane -s . -t '{right-of}'\; select-pane -t '{right-of}'

# Swap panes directionally (Ctrl+Alt, smart-splits aware)
# Brace-block form so we don't fight the if-shell re-parser. -d keeps focus on
# the moved (active) pane, replacing the old swap+select-pane dance.
bind-key -n C-M-h if -F "#{@pane-is-vim}" { send-keys C-M-h } { swap-pane -d -s '{left-of}' }
bind-key -n C-M-j if -F "#{@pane-is-vim}" { send-keys C-M-j } { swap-pane -d -s '{down-of}' }
bind-key -n C-M-k if -F "#{@pane-is-vim}" { send-keys C-M-k } { swap-pane -d -s '{up-of}' }
bind-key -n C-M-l if -F "#{@pane-is-vim}" { send-keys C-M-l } { swap-pane -d -s '{right-of}' }

# Quick fzf launchers
bind-key W run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"

# Sessionizer: zoxide + fzf → new/switch tmux session (prefix + f)
bind-key f run-shell -b "~/.config/tmux/scripts/tmux-sessionizer.sh"

# Search all pane contents (prefix + /)
bind-key / command-prompt -p "Search panes:" "display-popup -w 85% -h 85% -E '~/.config/tmux/scripts/search-panes.sh %1'"

# Better split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Essential plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Navigation & UX
set -g @plugin 'laktak/extrakto'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-sidebar'

# Development workflow
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'sainnhe/tmux-fzf'

# Visual enhancements
set -g @plugin 'janoamaral/tokyo-night-tmux'
# (tmux-battery removed: nothing referenced #{battery_*}; tokyo-night has its own widget)

# Floating popups (toggleable)
set -g @plugin '~/.config/tmux/plugins/tmux-popups'

# Continuum MUST be last so its status-right injection isn't overwritten by the theme
set -g @plugin 'tmux-plugins/tmux-continuum'

# Popup definitions (prefix + key + [1-9] to toggle)
set -g @popups-pi "a:pi"
set -g @popups-term "k:"
set -g @popups-width "80%"
set -g @popups-height "80%"

# Plugin configurations
# Auto-restore disabled — use prefix + Ctrl-r to restore manually on demand.
# set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Prune saved snapshots older than 7 days (default 30). Always keeps the newest 5.
set -g @resurrect-delete-backup-after '7'

# tmux-thumbs: the upstream defaults only run `tmux set-buffer`, which fills the
# *tmux* paste buffer and then cheerfully says "Copied" — the system clipboard is
# never touched. `-w` makes tmux forward the buffer to the terminal via OSC 52,
# which is what actually lands it in the Wayland clipboard.
set -g @thumbs-command 'tmux set-buffer -w -- {} && tmux display-message "Copied {}"'
set -g @thumbs-upcase-command 'tmux set-buffer -w -- {} && tmux paste-buffer && tmux display-message "Copied {}"'
set -g @thumbs-multi-command 'tmux set-buffer -w -- {} && tmux paste-buffer && tmux send-keys " " && tmux display-message "Copied multiple items!"'

# Directory bookmarks
# prefix + b: bookmark current pane's directory
# prefix + B: fzf-pick a bookmarked directory and open a new window there
bind-key b run-shell 'dir="#{pane_current_path}"; grep -qxF "$dir" ~/.tmux-bookmarks 2>/dev/null || echo "$dir" >> ~/.tmux-bookmarks; tmux display-message "Bookmarked: $dir"'
bind-key B run-shell -b 'dir=$(sort -u ~/.tmux-bookmarks 2>/dev/null | fzf-tmux -p -w 62% -h 38%) && [ -n "$dir" ] && tmux new-window -c "$dir"'

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# Pane borders (after tpm to override tokyo-night)
set -g pane-border-style "fg=#c84053"
set -g pane-active-border-style "fg=#c84053"
set -g pane-border-status off
set -g pane-border-format ""
set -g pane-border-indicators colour
set -g window-style "fg=#a9b1d6"
set -g window-active-style "fg=#ffffff"

set -g extended-keys on
set -g extended-keys-format csi-u

# WORKAROUND (tmux 3.7b): if message-style is explicitly set — by anything, even
# to its own default value — the command prompt (prefix + :) no longer clears the
# status line, so status-left/window-list/status-right stay painted over it.
# tokyo-night-tmux sets it. Unsetting it back to the built-in default fixes the
# overlap. tmux 3.6a is not affected. Must come after the tpm run line.
set -gu message-style
set -gu message-command-style

